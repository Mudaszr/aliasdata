<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AliasTrust</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/style.css">

<style>
body{
  background:#0b0d10;
  color:#eee;
  font-family:Arial, sans-serif;
}

.wrap{
  max-width:700px;
  margin:80px auto;
  padding:20px;
}
input,button{
  width:100%;
  padding:12px;
  margin:10px 0;
}
button{
  background:#fff;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="wrap">

<h1>AliasTrust — Early Access</h1>
<p>Apply for verified membership.</p>

<form action="mailto:aliasdatarecovery@gmail.com" method="post" enctype="text/plain">

<input name="Name" placeholder="Full Name" required>
<input name="Email" type="email" placeholder="Email" required>
<input name="Phone" placeholder="Phone" required>
<input name="Company" placeholder="Company">

<button type="submit">Apply</button>

</form>

<p style="color:#aaa;font-size:14px">
We review all applications manually.
</p>

</div>

</body>
</html>
