<!DOCTYPE html>
<html lang="en">

<head>

    <base href="/" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Alias Data</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

    <style>

        /* Contact Page Custom Styling */

        body {
            background: #f5f7fb;
        }

        .contact-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
        }

        .contact-card {
            background: #050720;
            color: #fff;
            max-width: 550px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            text-align: center;
        }

        .contact-card h1 {
            margin-bottom: 10px;
        }

        .contact-card p {
            color: #ccc;
            margin-bottom: 25px;
        }

        .contact-info {
            text-align: left;
            margin-bottom: 30px;
        }

        .contact-info div {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .contact-info i {
            width: 30px;
            font-size: 18px;
            color: #25d366;
        }

        .contact-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .contact-buttons a {
            padding: 12px 22px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            color: #fff;
            transition: 0.3s;
        }

        .btn-whatsapp {
            background: #25D366;
        }

        .btn-book {
            background: #1877f2;
        }

        .contact-buttons a:hover {
            transform: scale(1.05);
        }

        /* Social Icons */

        .contact-social {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .contact-social a {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 20px;
            text-decoration: none;
            transition: 0.3s;
        }

        .contact-social a:hover {
            transform: scale(1.15);
        }

        .instagram {
            background: linear-gradient(45deg,
                #feda75,
                #fa7e1e,
                #d62976,
                #962fbf,
                #4f5bd5
            );
        }

        .facebook {
            background: #1877f2;
        }

        .whatsapp {
            background: #25D366;
        }

        /* Back Button */

        .back-btn {
            display: inline-block;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }

        .back-btn i {
            margin-right: 5px;
        }

        .back-btn:hover {
            color: #fff;
        }

    </style>

</head>

<body>

<div class="contact-wrapper">

               target="_blank"
